description: Start a kind cluster
parameters:
  kind_version:
    description: "The kind version to use. See https://github.com/kubernetes-sigs/kind/releases"
    type: string
    default: "0.33.0"
  kind_node_image:
    description: "The kind node image to use. Pin by digest from the same kind release. See https://github.com/kubernetes-sigs/kind/releases"
    type: string
    default: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
  kind_config:
    description: "A Kind config file to use for the cluster. Default includes kubeadm v1beta3 (Kubernetes <1.36) and v1beta4 (Kubernetes 1.36+) patches."
    type: string
    default: |
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      kubeadmConfigPatches:
      - |
        apiVersion: kubeadm.k8s.io/v1beta3
        kind: ClusterConfiguration
        metadata:
          name: config
        apiServer:
          certSANs:
          - e2e-control-plane
          - 127.0.0.1
          - localhost
        etcd:
          local:
            serverCertSANs:
            - e2e-control-plane
            - 127.0.0.1
            - localhost
            peerCertSANs:
            - e2e-control-plane
            - 127.0.0.1
            - localhost
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        metadata:
          name: config
        apiServer:
          certSANs:
          - e2e-control-plane
          - 127.0.0.1
          - localhost
        etcd:
          local:
            serverCertSANs:
            - e2e-control-plane
            - 127.0.0.1
            - localhost
            peerCertSANs:
            - e2e-control-plane
            - 127.0.0.1
            - localhost
steps:
  - run:
      name: Start Kind Cluster
      command: |
        curl -LO https://github.com/kubernetes-sigs/kind/releases/download/v<< parameters.kind_version >>/kind-linux-amd64
        chmod +x kind-linux-amd64
        mkdir bin-kind && mv kind-linux-amd64 bin-kind/kind
        export PATH=$(pwd)/bin-kind:$PATH

        cat  >/tmp/kind.config \<<EOF
        << parameters.kind_config >>
        EOF


        kind version
        cat /tmp/kind.config

        kind create cluster \
            --name="e2e" \
            --image << parameters.kind_node_image >> \
            --config /tmp/kind.config \
            --wait=120s \
            --kubeconfig=./kind-kubeconfig
