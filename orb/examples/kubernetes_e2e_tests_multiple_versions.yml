description: >
  This example expands upon the kubernetes e2e test example by
  demonstrating how you could run the same test across multiple
  kubernetes versions.

usage:
  version: 2.1

  orbs:
    rok8s-scripts: fairwinds/rok8s-scripts@16

  workflows:
    version: 2
    build:
      jobs:
        - rok8s-scripts/kubernetes_e2e_tests:
            name: "End-To-End Test Kube 1.37.0"
            kind_node_image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
            pre_script: e2e/pre.sh
            script: e2e/test.sh
            post_script: e2e/post.sh
            filters:
              branches:
                only: /.*/
              tags:
                ignore: /.*/
        - rok8s-scripts/kubernetes_e2e_tests:
            name: "End-To-End Test Kube 1.34.11"
            kind_node_image: "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"
            pre_script: e2e/pre.sh
            script: e2e/test.sh
            post_script: e2e/post.sh
            filters:
              branches:
                only: /.*/
              tags:
                ignore: /.*/
